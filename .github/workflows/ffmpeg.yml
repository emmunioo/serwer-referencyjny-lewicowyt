# Buduje FFmpeg wbudowany w serwer (Linux i Windows) z TEGO repozytorium: ffmpeg/build.sh + ffmpeg/ffmpeg-config.sh.
# Linux jest budowany na ubuntu-22.04 (glibc 2.35), żeby binarka działała na starszych dystrybucjach.
# Wynik: artefakty ffmpeg-linux-x86_64 i ffmpeg-windows-x86_64 z sumami SHA-256 (pliki ffmpeg i ffprobe).
name: ffmpeg
on:
  workflow_dispatch: {}
  push:
    paths: ["ffmpeg/**", ".github/workflows/ffmpeg.yml"]
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Zależności
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config git perl libva-dev libdrm-dev
      - name: Budowanie
        working-directory: ffmpeg
        run: bash ./build.sh --jobs "$(nproc)"
      - name: Test
        working-directory: ffmpeg
        run: |
          B=$(ls -d dist/linux-*)
          "$B/ffmpeg" -hide_banner -encoders | grep -E "libx264|libx265|h264_nvenc|hevc_nvenc|h264_vaapi|hevc_vaapi|libopus|libjxl"
          "$B/ffmpeg" -v error -y -f lavfi -i testsrc2=size=320x180:rate=30 -t 1 -c:v libx265 -pix_fmt yuv420p /tmp/t.mp4
          "$B/ffprobe" -v error -show_entries stream=codec_name -of csv=p=0 /tmp/t.mp4
          sha256sum "$B/ffmpeg" "$B/ffprobe" | tee SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-x86_64
          path: |
            ffmpeg/dist/linux-*/ffmpeg
            ffmpeg/dist/linux-*/ffprobe
            ffmpeg/SHA256SUMS-linux.txt

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make perl diffutils patch
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf
      - name: Budowanie
        working-directory: ffmpeg
        run: |
          export PROCESSOR_ARCHITECTURE=AMD64
          ./build.sh --jobs "$(nproc)"
      - name: Test
        working-directory: ffmpeg
        run: |
          B=$(ls -d dist/windows-*)
          "$B/ffmpeg.exe" -hide_banner -encoders | grep -E "libx264|libx265|h264_nvenc|h264_amf|h264_qsv|libopus|libjxl"
          "$B/ffmpeg.exe" -v error -y -f lavfi -i testsrc2=size=320x180:rate=30 -t 1 -c:v libx265 -pix_fmt yuv420p t.mp4
          sha256sum "$B/ffmpeg.exe" "$B/ffprobe.exe" | tee SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x86_64
          path: |
            ffmpeg/dist/windows-*/ffmpeg.exe
            ffmpeg/dist/windows-*/ffprobe.exe
            ffmpeg/SHA256SUMS-windows.txt
